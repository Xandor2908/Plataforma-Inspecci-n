<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTABLO Admin - Checklists</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div id="page-content" style="display:none">

<div class="container wide" id="vista-tarjetas">
  <div class="card" style="display:flex; justify-content:space-between; align-items:center">
    <div>
      <h2 style="margin:0">Editar Checklist</h2>
      <p style="font-size:12.5px;color:var(--ink-3);margin:4px 0 0">Plantillas por combinación de equipo, organizadas en secciones y pasos.</p>
    </div>
    <button class="btn verde" id="btn-nueva-plantilla" style="margin-top:0">+ Nueva plantilla</button>
  </div>

  <div class="checklist-grid" id="grid-checklists"></div>
</div>

<div class="container" id="vista-editor" style="display:none">
  <button class="btn secundario" id="btn-volver" style="margin-bottom:10px">‹ Volver a plantillas</button>
  <div class="card">
    <h2 style="margin-top:0">Editar plantilla</h2>
    <p style="font-size:12.5px;color:var(--ink-3);margin-top:-8px">Organiza el checklist en secciones (por equipo o sistema) y sus pasos.</p>

    <div class="grid-menu" style="grid-template-columns: 2fr 1fr 1fr; margin-bottom:10px">
      <div>
        <label>Nombre de la plantilla</label>
        <input id="ed-nombre">
      </div>
      <div>
        <label>Frecuencia</label>
        <select id="ed-frecuencia">
          <option>Diaria</option>
          <option>Semanal</option>
          <option>Mensual</option>
        </select>
      </div>
      <div>
        <label>Tipo de checklist</label>
        <select id="ed-tipo-checklist">
          <option value="preoperacional">Inspección pre-operacional</option>
          <option value="mantenimiento">Mantenimiento</option>
        </select>
      </div>
    </div>

    <label>Selección de equipos implicados</label>
    <p style="font-size:12px;color:var(--ink-3);margin:2px 0 8px">Toca los equipos que deben registrarse para completar este checklist.</p>
    <div id="ed-equipos-botones" class="equipo-toggle-grid"></div>

    <div id="ed-secciones" style="margin-top:18px"></div>
    <button class="btn-agregar-seccion" id="btn-agregar-seccion">+ Agregar sección</button>

    <div class="error-msg" id="ed-error" style="margin-top:10px"></div>
    <button class="btn verde" id="btn-guardar-plantilla">Guardar plantilla</button>
    <button class="btn secundario" id="btn-cancelar-plantilla">Cancelar</button>
  </div>
</div>

</div>

<script src="../js/common.js"></script>
<script src="js/checklists.js"></script>
</body>
</html>
