<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTABLO Admin - Usuarios</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container wide" id="page-content" style="display:none">

  <div class="card">
    <h2>Nuevo usuario</h2>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
      <div><label>Nombre</label><input id="nuevo-nombre-usuario"></div>
      <div><label>Usuario</label><input id="nuevo-usuario-login"></div>
      <div><label>Contraseña</label><input id="nuevo-usuario-password" type="password"></div>
      <div><label>Rol</label>
        <select id="nuevo-usuario-rol">
          <option value="operador">No admin (operador)</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button class="btn" id="btn-crear-usuario" style="margin-top:0">Crear</button>
    </div>
    <div class="error-msg" id="usuario-error"></div>
  </div>

  <div class="card">
    <h2>Usuarios registrados</h2>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px">
      <div>
        <label>Rol</label>
        <select id="filtro-rol"><option value="">Todos</option><option value="admin">Admin</option><option value="operador">No admin</option></select>
      </div>
      <div>
        <label>Estado</label>
        <select id="filtro-estado-usuario"><option value="">Todos</option><option value="activo">Activo</option><option value="inactivo">Inactivo</option></select>
      </div>
      <div style="flex:1; min-width:200px">
        <label>Buscar usuario</label>
        <div style="display:flex; gap:8px">
          <input id="buscar-usuario" placeholder="Nombre de usuario...">
          <button class="btn small" id="btn-buscar-usuario" style="margin-top:0">Buscar</button>
        </div>
      </div>
    </div>
    <div class="error-msg" id="busqueda-error"></div>
    <table class="tabla">
      <thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
      <tbody id="tabla-usuarios"></tbody>
    </table>
  </div>

</div>

<div id="modal-editar" style="display:none; position:fixed; inset:0; background:#0008; align-items:center; justify-content:center;">
  <div class="card" style="max-width:400px; width:90%">
    <h3>Editar usuario</h3>
    <label>Nombre</label>
    <input id="e-nombre">
    <label>Rol</label>
    <select id="e-rol">
      <option value="operador">No admin (operador)</option>
      <option value="admin">Admin</option>
    </select>
    <div class="error-msg" id="editar-error"></div>
    <button class="btn" id="btn-guardar-usuario">Guardar cambios</button>
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--line)">
    <button class="btn secundario" id="btn-restablecer">Restablecer contraseña</button>
    <button class="btn secundario" onclick="document.getElementById('modal-editar').style.display='none'">Cerrar</button>
  </div>
</div>

<div id="modal-restablecer" style="display:none; position:fixed; inset:0; background:#0008; align-items:center; justify-content:center;">
  <div class="card" style="max-width:380px; width:90%">
    <h3>Restablecer contraseña</h3>
    <label>Nueva contraseña</label>
    <div style="display:flex; gap:8px">
      <input id="r-password" style="flex:1">
      <button class="btn small secundario" id="btn-generar-password" style="margin-top:0">Generar</button>
    </div>
    <div class="error-msg" id="restablecer-error"></div>
    <p style="font-size:12px;color:var(--ink-3)">Esta contraseña solo se mostrará esta vez. Anótala antes de cerrar.</p>
    <button class="btn verde" id="btn-confirmar-restablecer">Guardar nueva contraseña</button>
    <button class="btn secundario" onclick="document.getElementById('modal-restablecer').style.display='none'">Cancelar</button>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
