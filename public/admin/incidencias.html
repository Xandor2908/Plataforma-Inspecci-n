<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTABLO Admin - Incidencias</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="topbar">
  <h1>ESTABLO · Incidencias</h1>
  <div class="user-info">
    <a href="dashboard.html" style="color:#fff;margin-right:10px">← Panel</a>
    <span id="nombre-usuario"></span>
    &nbsp;·&nbsp;<button onclick="cerrarSesion()">Salir</button>
  </div>
</header>
<div class="container wide">

  <div style="margin-bottom:14px">
    <button class="btn small" data-filtro="" style="margin-top:0">Todas</button>
    <button class="btn small secundario" data-filtro="pendiente" style="margin-top:0">Pendientes</button>
    <button class="btn small secundario" data-filtro="resuelta" style="margin-top:0">Resueltas</button>
  </div>

  <div class="card">
    <table class="tabla">
      <thead><tr><th>Código</th><th>Checklist</th><th>Equipos</th><th>Descripción</th><th>Estado</th><th></th></tr></thead>
      <tbody id="tabla-incidencias"></tbody>
    </table>
  </div>

</div>

<div id="modal-detalle" style="display:none; position:fixed; inset:0; background:#0008; align-items:center; justify-content:center;">
  <div class="card" style="max-width:480px; width:90%">
    <h3 id="detalle-codigo"></h3>
    <p><b>Checklist:</b> <span id="detalle-checklist"></span></p>
    <p><b>Equipos:</b> <span id="detalle-equipos"></span></p>
    <p><b>Folio:</b> <span id="detalle-folio"></span></p>
    <p><b>Descripción:</b> <span id="detalle-descripcion"></span></p>
    <img id="detalle-foto" style="max-width:100%; border-radius:8px; display:none; margin-bottom:10px">
    <div id="detalle-resuelta-info" style="display:none">
      <p><b>Solución:</b> <span id="detalle-solucion"></span></p>
    </div>
    <div id="detalle-form-resolver">
      <label>Descripción de la solución</label>
      <textarea id="detalle-solucion-input"></textarea>
      <button class="btn verde" id="btn-marcar-resuelta">Marcar como resuelta</button>
    </div>
    <button class="btn secundario" id="btn-marcar-pendiente" style="display:none">Marcar como pendiente</button>
    <button class="btn secundario" onclick="document.getElementById('modal-detalle').style.display='none'">Cerrar</button>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="js/incidencias.js"></script>
</body>
</html>
