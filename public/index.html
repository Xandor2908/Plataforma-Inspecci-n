<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTABLO - Ingresar</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>ESTABLO</h1>
    <div class="subtitulo">Mantenimiento de equipos · Sobitec</div>
    <form id="form-login">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="error-msg" id="error-msg"></div>
      <button class="btn" type="submit" style="width:100%">Ingresar</button>
    </form>
  </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
